<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Santino Musse">
    <meta name="description" content="Carrito de compras de Escape Libre: revisá tus productos, calculá el envío y finalizá tu compra.">
    <meta name="keywords" content="carrito, compra, partes de autos, escapes, frenos, envío">
    <title>Carrito | Escape Libre</title>
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body onload="actualizarCarrito()">
    <div id="contenedor">

        <header id="cabecera">
            <div class="barra-superior">
                <h1>
                    <a href="index.html">
                        <img src="imagenes/logo-escape-libre.png" alt="Escape Libre, tu auto sin límites">
                    </a>
                </h1>
                <div class="buscador">
                    <label class="solo-lectores" for="busqueda">Buscar productos, marcas o autos</label>
                    <input type="text" id="busqueda" name="busqueda" placeholder="Buscar productos, marcas, autos...">
                    <button type="button">Buscar</button>
                </div>
                <div class="acciones">
                    <a href="contacto.html">Mi cuenta</a>
                    <a href="carrito.html">Carrito <span id="contador-carrito">0</span></a>
                </div>
            </div>
            <nav id="menu">
                <a href="catalogo.html">Todas las categorías</a>
                <a href="catalogo.html">Marcas</a>
                <a href="catalogo.html">Por vehículo</a>
                <a href="catalogo.html">Ofertas</a>
                <a href="catalogo.html">Novedades</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </header>

        <main>
            <div class="contenido-carrito">
                <nav class="migas" aria-label="Ruta de navegación">
                    <a href="index.html">Inicio</a> &gt; <span>Carrito</span>
                </nav>

                <h2 id="titulo-carrito">Mi carrito (3 productos)</h2>

                <div class="carrito-columnas">
                    <section id="lista-productos">
                        <article class="producto-carrito" id="item-filtro" data-precio="120000">
                            <img src="imagenes/Admision Carrito.png" alt="Filtro de aire deportivo rojo">
                            <div class="producto-datos">
                                <h3>Filtro de aire K&amp;N</h3>
                                <p class="producto-precio">$ 120.000</p>
                            </div>
                            <div class="cantidad">
                                <button type="button" onclick="cambiarCantidad('filtro', -1)" aria-label="Restar una unidad de Filtro de aire K&amp;N">-</button>
                                <label class="solo-lectores" for="cantidad-filtro">Cantidad de Filtro de aire K&amp;N</label>
                                <input type="text" id="cantidad-filtro" value="1" inputmode="numeric" onchange="validarCantidad('filtro')">
                                <button type="button" onclick="cambiarCantidad('filtro', 1)" aria-label="Sumar una unidad de Filtro de aire K&amp;N">+</button>
                            </div>
                            <button type="button" class="eliminar" onclick="eliminarProducto('filtro')" aria-label="Eliminar Filtro de aire K&amp;N del carrito">Eliminar</button>
                        </article>

                        <article class="producto-carrito" id="item-downpipe" data-precio="750000">
                            <img src="imagenes/categoria-escapes.jpg" alt="Downpipe de acero inoxidable">
                            <div class="producto-datos">
                                <h3>Downpipe HKS</h3>
                                <p class="producto-precio">$ 750.000</p>
                            </div>
                            <div class="cantidad">
                                <button type="button" onclick="cambiarCantidad('downpipe', -1)" aria-label="Restar una unidad de Downpipe HKS">-</button>
                                <label class="solo-lectores" for="cantidad-downpipe">Cantidad de Downpipe HKS</label>
                                <input type="text" id="cantidad-downpipe" value="1" inputmode="numeric" onchange="validarCantidad('downpipe')">
                                <button type="button" onclick="cambiarCantidad('downpipe', 1)" aria-label="Sumar una unidad de Downpipe HKS">+</button>
                            </div>
                            <button type="button" class="eliminar" onclick="eliminarProducto('downpipe')" aria-label="Eliminar Downpipe HKS del carrito">Eliminar</button>
                        </article>

                        
        </main>

        <footer id="pie">
            <p>Escape Libre &copy; 2026. Proyecto de Taller de Desarrollo Web.</p>
            <p>Autores: Santino Musse</p>
        </footer>

    </div>
    <script src="carrito.js"></script>
</body>
</html>
